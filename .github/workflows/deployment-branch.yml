# Pushes an orphan branch `deployment` with production PHP deps, Vite build, and a minimal runtime tree.
# Trigger: push to `development`. Does not run on your machine.
#
# INCLUDED: app, bootstrap, config, public (with public/build), routes, vendor (--no-dev),
#           database/migrations + database/seeders, resources/views, storage skeleton,
#           artisan, composer.json, composer.lock, .env.example.
#
# NOT included (no dev / build tooling on the branch): node_modules, package.json, vite/tsconfig/eslint/prettier,
# phpunit, tests, .github, resources/js, resources/css, database/factories, README, components.json, etc.
# composer.json may still list require-dev in JSON; vendor/ is installed with --no-dev only.
#
# Server still needs: .env (or env vars), writable storage/bootstrap/cache, `php artisan migrate`, etc.
# If branch protection blocks force-push: repo Settings → Actions → Workflow permissions (read/write),
# and allow bypass for Actions on `deployment`, OR set secret DEPLOY_BRANCH_TOKEN (PAT with repo scope).

name: Publish deployment branch

on:
  push:
    branches:
      - development

permissions:
  contents: write

concurrency:
  group: deployment-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo, sqlite, pdo_sqlite, zip, intl, curl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm and build frontend
        run: |
          npm ci
          npm run build

      - name: Remove Vite dev hot file
        run: rm -f public/hot

      - name: Assemble deployment tree
        run: |
          set -euo pipefail
          DEPLOY_DIR=$(mktemp -d)
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

          # Runtime PHP tree only (front source + Node/Prettier/ESLint never copied — only public/build)
          cp -a app bootstrap config public routes vendor artisan composer.json composer.lock "$DEPLOY_DIR/"

          mkdir -p "$DEPLOY_DIR/database"
          cp -a database/migrations database/seeders "$DEPLOY_DIR/database/"
          [ -f database/.gitignore ] && cp -a database/.gitignore "$DEPLOY_DIR/database/"

          mkdir -p "$DEPLOY_DIR/resources"
          cp -a resources/views "$DEPLOY_DIR/resources/"

          cp -a storage "$DEPLOY_DIR/"

          [ -f .env.example ] && cp -a .env.example "$DEPLOY_DIR/"

          # Sanity: built assets must exist
          test -f public/build/manifest.json || (echo "missing public/build/manifest.json" && exit 1)

      - name: Push orphan branch deployment
        env:
          TOKEN: ${{ secrets.DEPLOY_BRANCH_TOKEN != '' && secrets.DEPLOY_BRANCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git init -b deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: build from ${GITHUB_SHA:0:7} (${GITHUB_SHA})"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deployment

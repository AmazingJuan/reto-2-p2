name: Publish deployment branch

on:
  push:
    branches:
      - development

permissions:
  contents: write

concurrency:
  group: deployment-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo, sqlite, pdo_sqlite, zip, intl, curl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm and build frontend
        run: |
          npm ci
          npm run build

      - name: Remove Vite dev hot file
        run: rm -f public/hot

      - name: Assemble deployment tree
        run: |
          set -euo pipefail
          DEPLOY_DIR=$(mktemp -d)
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

          # Core Laravel runtime
          cp -a app bootstrap config public routes vendor artisan composer.json composer.lock "$DEPLOY_DIR/"

          # Database
          mkdir -p "$DEPLOY_DIR/database"
          cp -a database/migrations database/seeders "$DEPLOY_DIR/database/"
          [ -f database/.gitignore ] && cp -a database/.gitignore "$DEPLOY_DIR/database/"

          # Views only
          mkdir -p "$DEPLOY_DIR/resources"
          cp -a resources/views "$DEPLOY_DIR/resources/"

          # Storage
          cp -a storage "$DEPLOY_DIR/"

          # Env example
          [ -f .env.example ] && cp -a .env.example "$DEPLOY_DIR/"

          [ -f Dockerfile ] && cp -a Dockerfile "$DEPLOY_DIR/"
          [ -f nginx.conf ] && cp -a nginx.conf "$DEPLOY_DIR/"
          [ -f docker-compose.yml ] && cp -a docker-compose.yml "$DEPLOY_DIR/"
          [ -d docker ] && cp -a docker "$DEPLOY_DIR/"

          # Sanity check
          test -f public/build/manifest.json || (echo "missing build" && exit 1)

      - name: Push orphan branch deployment
        env:
          TOKEN: ${{ secrets.DEPLOY_BRANCH_TOKEN != '' && secrets.DEPLOY_BRANCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git init -b deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: build from ${GITHUB_SHA:0:7}"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deployment
